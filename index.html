<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Self-Help Screening Tools</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: auto; padding: 1em; }
        header, footer { text-align: center; margin: 1em 0; }
        nav a { margin: 0 1em; text-decoration: none; color: blue; }
        main { margin-top: 2em; }
        button { margin-top: 1em; }
    </style>
    <script>
        const translations = {
            en: {
                siteTitle: "Self-Help Screening Tools",
                welcomeMsg: "Welcome! Choose a questionnaire from the menu.",
                nav_home: "Home",
                nav_test1: "Questionnaire 1",
                nav_test2: "Questionnaire 2",
                content_home: "<p>This is your starting page. Here you can introduce your website, explain the purpose of the screening tools, and provide disclaimers or psychoeducation.</p><p>Select a questionnaire from the navigation menu to continue.</p>",
                content_test1: "<h2>Questionnaire 1</h2><p>Placeholder for your questionnaire content.</p>",
                content_test2: "<h2>Questionnaire 2</h2><p>Placeholder for your questionnaire content.</p>"
            },
            et: {
                siteTitle: "Eneseabi Sõeluuringud",
                welcomeMsg: "Tere tulemast! Vali küsimustik menüüst.",
                nav_home: "Avaleht",
                nav_test1: "Küsimustik 1",
                nav_test2: "Küsimustik 2",
                content_home: "<p>See on algusleht. Siin saad tutvustada veebilehte, selgitada sõeluuringute eesmärki ning lisada hoiatusi või psühhoharidust.</p><p>Vali küsimustik menüüst, et jätkata.</p>",
                content_test1: "<h2>Küsimustik 1</h2><p>Küsimustiku sisu kohahoidja.</p>",
                content_test2: "<h2>Küsimustik 2</h2><p>Küsimustiku sisu kohahoidja.</p>"
            }
        };

        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('siteTitle').innerText = translations[lang].siteTitle;
            document.getElementById('welcomeMsg').innerText = translations[lang].welcomeMsg;
            document.getElementById('nav_home').innerText = translations[lang].nav_home;
            document.getElementById('nav_test1').innerText = translations[lang].nav_test1;
            document.getElementById('nav_test2').innerText = translations[lang].nav_test2;
            loadContent('home');
        }

        function loadContent(page) {
            let contentKey = 'content_' + page;
            document.getElementById('mainContent').innerHTML = translations[currentLang][contentKey];
        }

        window.onload = function() {
            setLanguage('en'); // default language
        };
    </script>
</head>
<body>
    <header>
        <h1 id="siteTitle">Self-Help Screening Tools</h1>
        <button onclick="setLanguage(currentLang === 'en' ? 'et' : 'en')">EN / ET</button>
    </header>

    <nav>
        <a href="#" onclick="loadContent('home')" id="nav_home">Home</a>
        <a href="#" onclick="loadContent('test1')" id="nav_test1">Questionnaire 1</a>
        <a href="#" onclick="loadContent('test2')" id="nav_test2">Questionnaire 2</a>
    </nav>

    <main>
        <p id="welcomeMsg">Welcome! Choose a questionnaire from the menu.</p>
        <div id="mainContent"></div>
    </main>

    <footer>
        <p>&copy; 2025 YourSiteName</p>
    </footer>
</body>
</html>
